<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0716">
<title>Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0716; }
  body { font-family: "Press Start 2P", monospace; color: #ffe3ef; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  #timer { position: fixed; left: 16px; right: 16px; top: 50%; text-align: center; opacity: 0; transition: opacity 2s; pointer-events: none; }
  #timer.show { opacity: 1; }
  .label { font-size: 8px; letter-spacing: 2px; color: #ff8fb8; }
  #days { font-size: 32px; margin: 20px 0 14px; text-shadow: 4px 4px 0 #c2185b; }
  #clock { font-size: 16px; margin-bottom: 20px; text-shadow: 2px 2px 0 #c2185b; }
  #msg { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); font-size: 8px; color: #ff8fb8; pointer-events: none; }
  #msg::after { content: "_"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="timer">
  <div class="label">TOGETHER FOR</div>
  <div id="days"></div>
  <div id="clock"></div>
  <div class="label">SINCE 07.11.2025</div>
</div>
<div id="msg"></div>
<script>
const START = [2025, 10, 7]; // 7 November 2025 (month is 0-based)
const MESSAGES = ['I love you', 'you + me = <3', 'my favorite person', 'forever & always', 'I love you more'];
const PX = 4; // screen pixels per art pixel
const COLORS = ['#ff4d8d', '#ff2e63', '#ff8fb8', '#ffd166', '#c77dff'];
const HEART = ['0110110', '1111111', '1111111', '0111110', '0011100', '0001000'];

const c = document.getElementById('c'), ctx = c.getContext('2d');
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
let W, H, stars, rockets = [], sparks = [], ghosts = [], n = 0;

function resize() {
  W = c.width = Math.ceil(innerWidth / PX);
  H = c.height = Math.ceil(innerHeight / PX);
  stars = Array.from({ length: W * H / 120 | 0 }, () => ({ x: Math.random() * W | 0, y: Math.random() * H * 0.85 | 0, p: rand(0, 6) }));
}
addEventListener('resize', resize);
resize();

function launch(tx = W * rand(0.15, 0.85), ty = H * rand(0.1, 0.3)) {
  const x = tx + rand(-0.1, 0.1) * W, vy = -H / 70;
  rockets.push({ x, y: H, vx: (tx - x) / ((H - ty) / -vy), vy, ty });
}

function explode(x, y) {
  const color = pick(COLORS), s = Math.min(W, H) / 1600 * rand(0.8, 1.2);
  // two rings of particles flying out along the heart curve
  for (const k of [1, 0.6]) for (let i = 0; i < 50; i++) {
    const t = i / 50 * Math.PI * 2;
    sparks.push({ x, y, life: rand(60, 90), color,
      vx: 16 * Math.sin(t) ** 3 * s * k,
      vy: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * s * k });
  }
  // big faint pixel-heart shadow + a few tiny hearts floating up
  ghosts.push({ x, y, vy: 0, s: Math.max(2, Math.round(s * 90)), a: 0.08, life: 90, color });
  for (let i = 0; i < 3; i++) ghosts.push({ x: x + rand(-15, 15), y: y + rand(-5, 15), vy: -0.3, s: 1, a: 0.8, life: rand(60, 100), color: pick(COLORS) });
}

function drawHeart(g) {
  ctx.fillStyle = g.color;
  ctx.globalAlpha = g.a * Math.min(1, g.life / 40);
  HEART.forEach((row, j) => [...row].forEach((b, i) => {
    if (b === '1') ctx.fillRect(Math.round(g.x + (i - 3.5) * g.s), Math.round(g.y + (j - 3) * g.s), g.s, g.s);
  }));
}

function step() {
  n++;
  if (n < 300 ? n % 50 === 1 : Math.random() < 0.008) launch();
  if (n === 270) document.getElementById('timer').classList.add('show');
  if (n === 330) typeMessages();

  ctx.globalAlpha = 0.25; ctx.fillStyle = '#0b0716'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  for (const st of stars) { ctx.globalAlpha = 0.2 + 0.4 * Math.abs(Math.sin(n / 60 + st.p)); ctx.fillRect(st.x, st.y, 1, 1); }

  rockets = rockets.filter(r => {
    r.x += r.vx; r.y += r.vy;
    sparks.push({ x: r.x, y: r.y, vx: 0, vy: 0, life: 15, color: '#ffd166' });
    ctx.globalAlpha = 1; ctx.fillStyle = '#fff8e7'; ctx.fillRect(r.x | 0, r.y | 0, 1, 1);
    if (r.y > r.ty) return true;
    explode(r.x, r.y);
    return false;
  });
  ghosts = ghosts.filter(g => { g.y += g.vy; drawHeart(g); return --g.life > 0; });
  sparks = sparks.filter(p => {
    p.vx *= 0.96; p.vy = p.vy * 0.96 + 0.01; p.x += p.vx; p.y += p.vy;
    if (p.life > 20 || Math.random() < 0.6) { // crackle as they die
      ctx.globalAlpha = Math.min(1, p.life / 30); ctx.fillStyle = p.color; ctx.fillRect(p.x | 0, p.y | 0, 1, 1);
    }
    return --p.life > 0;
  });
}

// fixed 60 steps/s so 120Hz phones don't run double speed
let last = performance.now(), acc = 0;
requestAnimationFrame(function frame(t) {
  acc = Math.min(acc + t - last, 100); last = t;
  for (; acc >= 1000 / 60; acc -= 1000 / 60) step();
  requestAnimationFrame(frame);
});

addEventListener('pointerdown', e => launch(e.clientX / PX, e.clientY / PX));

const pad = v => String(v).padStart(2, '0');
function tick() {
  const now = new Date();
  // calendar days (DST-safe) + time since today's midnight
  const days = Math.round((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - Date.UTC(...START)) / 864e5);
  document.getElementById('days').textContent = `${days} DAY${days === 1 ? '' : 'S'}`;
  document.getElementById('clock').textContent = `${pad(now.getHours())}H ${pad(now.getMinutes())}M ${pad(now.getSeconds())}S`;
}
tick();
setInterval(tick, 1000);

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function typeMessages() {
  const el = document.getElementById('msg');
  for (let i = 0; ; i = (i + 1) % MESSAGES.length) {
    for (const ch of MESSAGES[i]) { el.textContent += ch; await sleep(90); }
    await sleep(2500);
    el.textContent = '';
    await sleep(500);
  }
}
</script>
</body>
</html>
